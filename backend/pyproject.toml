[build-system]
requires = ["setuptools>=75,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicare-backend"
version = "0.1.0"
description = "FastAPI and CrewAI backend for the OmniCare Financial Customer Assistant prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.12.5",
  "crewai==1.15.15",
  "openai==2.54.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-ra"
